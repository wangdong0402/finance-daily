name: 每日财经自动更新

on:
  schedule:
    - cron: '15 23 * * *'  # 北京时间 07:15
    - cron: '30 4 * * *'   # 北京时间 12:30
    - cron: '45 12 * * *'  # 北京时间 20:45
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# ✅ 新增：同一时刻只跑一轮，防止两次调度互踩
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下载仓库文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # ✅ 新增：拉全历史，rebase 才不会卡

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取新闻
        run: python fetch.py

      - name: 抓取研报
        run: python fetch_reports.py

      - name: 抓取市场情绪
        run: python fetch_sentiment.py

      - name: 抓取宏观数据
        run: python fetch_macro.py

      - name: 生成网页
        run: python generate.py

      - name: 检查产物                # ✅ 新增：产物为空立刻报清楚
        run: |
          test -d dist || { echo "::error::dist 目录不存在，generate.py 没有生成网页"; exit 1; }
          du -sh dist

      - name: 保存数据和网页到仓库
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dist/
          git diff --staged --quiet || git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # ✅ 关键修复：推之前先对齐远端，彻底解决 fetch first
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
            echo "::warning::rebase 有冲突，改为用本次生成结果覆盖 data/ 与 dist/"
            git rebase --abort || true
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add data/ dist/
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
