name: 每日财经自动更新

on:
  schedule:
    - cron: '15 23 * * *'  # 北京时间 07:15
    - cron: '30 4 * * *'   # 北京时间 12:30
    - cron: '45 12 * * *'  # 北京时间 20:45
  workflow_dispatch:

permissions:
  contents: write          # ✅ 分支发布只需要这一个

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    # ✅ 删掉了 environment，因为不再走 Actions 部署环境

    steps:
      - name: 下载仓库文件
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取新闻
        run: python fetch.py

      - name: 抓取研报
        run: python fetch_reports.py

      - name: 抓取市场情绪
        run: python fetch_sentiment.py

      - name: 抓取宏观数据
        run: python fetch_macro.py

      - name: 生成网页
        run: python generate.py

      - name: 检查产物
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html 不存在，generate.py 没有生成网页"; exit 1; }
          du -sh dist

      - name: 保存数据到仓库
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
            git rebase --abort || true
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add data/
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ✅ 唯一新增：把 dist 推到 gh-pages 分支，Pages 直接读它
      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true      # 每次用全新提交，分支历史不会越滚越大
